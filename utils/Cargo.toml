[package]
name = "bootanim_ctl"
version = "1.0.0"
edition = "2021"

[dependencies]
rustix = { version = "0.38", features = ["fs", "mount"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
libc = "0.2"
crc32fast = "1"
