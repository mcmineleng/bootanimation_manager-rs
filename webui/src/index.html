<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bootanim-manager</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; padding: 16px; margin: 0; }
        h2 { margin: 0 0 16px; }
        h3 { margin: 24px 0 12px; border-top: 1px solid #ddd; padding-top: 16px; }
        label { display: block; margin: 12px 0 6px; font-weight: bold; }
        select, button, input { width: 100%; padding: 12px; font-size: 16px; }
        button { margin-top: 12px; cursor: pointer; }
        .status { margin-top: 12px; white-space: pre-wrap; color: #555; font-size: 14px; }
        .status.err { color: #c00; }
        .status.ok { color: #188038; }
        #fileList { margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; max-height: 50vh; overflow-y: auto; }
        .file-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .file-item:last-child { border-bottom: none; }
        .file-item.dir { color: #1a73e8; font-weight: bold; }
        .file-item.zip { color: #188038; }
        .file-item.disabled { color: #aaa; cursor: default; }
        .path-bar { font-size: 13px; color: #666; margin-top: 8px; word-break: break-all; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row button { flex: 1; }
        pre.logs { background: #f5f5f5; padding: 10px; font-size: 12px; white-space: pre-wrap; max-height: 160px; overflow-y: auto; border-radius: 6px; }
    </style>
</head>
<body>
    <h2>开机动画管理</h2>

    <h3>当前状态</h3>
    <button id="refreshStatusBtn">刷新状态</button>
    <div id="statusBox" class="status">加载中...</div>

    <h3>选择开机动画</h3>
    <label for="animSelect">动画列表</label>
    <select id="animSelect">
        <option value="">加载中...</option>
    </select>
    <div class="btn-row">
        <button id="useBtn">设为默认</button>
        <button id="applyBtn">应用</button>
        <button id="revertBtn">卸载</button>
    </div>
    <div id="actionStatus" class="status"></div>

    <h3>安装动画</h3>
    <div class="btn-row">
        <button id="upBtn">返回上一级</button>
        <button id="homeBtn">回到 /sdcard</button>
    </div>
    <div class="path-bar" id="pathBar">当前路径: /sdcard</div>
    <div id="fileList"></div>
    <div id="installStatus" class="status"></div>

    <h3>日志</h3>
    <pre class="logs" id="logsBox"></pre>

    <script type="module" src="./index.js"></script>
</body>
</html>
